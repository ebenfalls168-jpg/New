name: probe
on:
  push:
    paths: [.github/workflows/probe.yml]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="ipo-alert ebenfalls168-jpg@users.noreply.github.com"
          for u in \
            "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&company=anthropic&type=S-1&dateb=&owner=include&count=40&output=atom" \
            "https://efts.sec.gov/LATEST/search-index?keysTyped=anthropic" \
            "https://efts.sec.gov/LATEST/search-index?q=%22Anthropic%22&forms=S-1" \
            "https://www.sec.gov/files/company_tickers.json" \
            "https://data.sec.gov/submissions/CIK0000320193.json"; do
            echo "== $u"; curl -sS -A "$UA" -o out -w "%{http_code}\n" "$u"; head -c 1500 out | tr '\n' ' '; echo
          done
