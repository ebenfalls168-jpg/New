name: SpaceX streak analysis

on:
  push:
    paths:
      - scripts/spacex_streaks.py
      - .github/workflows/spacex-analysis.yml
  workflow_dispatch:

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance pandas tabulate
      - run: python scripts/spacex_streaks.py
